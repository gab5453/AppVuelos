name: Deploy API (Azure App Service)

# Compila y prueba la API (monorepo con 4 capas) y despliega un paquete listo para ejecutar:
# dependencias de producción, el `dist` de cada capa y los contratos. App Service solo ejecuta
# `node EcoAirlines.API/dist/main.js` (sin compilar en el servidor: SCM_DO_BUILD_DURING_DEPLOYMENT=false).
on:
  push:
    branches: [main]
    paths:
      - 'EcoAirlines.*/**'
      - 'contract/**'
      - 'dev-auth/openapi.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest*.ts'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos, lint y pruebas
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run test:e2e

      - name: Armar el paquete de despliegue
        run: |
          npm prune --omit=dev
          mkdir -p deploy/contract deploy/dev-auth
          cp package.json package-lock.json deploy/
          # -L copia el contenido de los enlaces de los workspaces (node_modules/@ecoairlines/* → cada capa).
          cp -rL node_modules deploy/node_modules
          for layer in EcoAirlines.DataAccess EcoAirlines.DataManagement EcoAirlines.Business EcoAirlines.API; do
            mkdir -p "deploy/$layer"
            cp -r "$layer/dist" "$layer/package.json" "deploy/$layer/"
          done
          cp contract/*.yaml deploy/contract/
          cp dev-auth/openapi.yaml deploy/dev-auth/
          du -sh deploy

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ecoairlines-api-gv
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: deploy
