name: Deploy dev-auth (Azure App Service)

# Despliega el servidor de autenticación (carpeta dev-auth) con sus dependencias de producción.
# App Service ejecuta `node server.mjs` (SCM_DO_BUILD_DURING_DEPLOYMENT=false).
on:
  push:
    branches: [main]
    paths:
      - 'dev-auth/**'
      - '.github/workflows/deploy-auth.yml'
  workflow_dispatch:

concurrency:
  group: deploy-auth
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias de producción y revisar
        working-directory: dev-auth
        run: |
          npm ci --omit=dev
          node --check server.mjs

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ecoairlines-auth-gv
          publish-profile: ${{ secrets.AZURE_AUTH_PUBLISH_PROFILE }}
          package: dev-auth
