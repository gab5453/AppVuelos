openapi: 3.0.3
info:
  title: dev-auth — Servidor de autenticación de DESARROLLO
  version: 1.0.0
  description: |
    Simula el servidor OAuth2 externo que el contrato da por existente (`auth.booking-hub.com`). **No es parte de la API de
    vuelos**: es otro servicio (puerto 4000). La API solo verifica los JWT que emite.

    Desde aquí se puede registrar un cliente y obtener su token para probar la API en el mismo Swagger:
    1. `POST /login` (o `POST /register`) → copiar `access_token` de la respuesta.
    2. Elegir otro documento en el selector de arriba → **Authorize** → pegar el token (sin `Bearer`).

    Los scopes dependen del rol: un cliente (`CUSTOMER`) recibe `flights:read flights:hold flights:book flights:cancel
    ecoairlines:profile`; el administrador (`ADMIN`), `flights:read flights:webhooks ecoairlines:admin`. Las cuentas creadas con
    `/register` son siempre `CUSTOMER`. Las contraseñas se guardan derivadas con scrypt y nunca se devuelven.

    Usuarios de prueba: `demo@ecoairlines.test` / `EcoDemo2026`, `maria@ecoairlines.test` / `EcoMaria2026`,
    `luis@ecoairlines.test` / `EcoLuis2026` y el administrador `admin@ecoairlines.test` / `EcoAdmin2026`.
    Las cuentas viven en memoria: se pierden al reiniciar dev-auth. Solo desarrollo (no arranca con `NODE_ENV=production`).
servers:
  - url: http://localhost:4000
    description: dev-auth local
tags:
  - name: Autenticación (desarrollo)
paths:
  /register:
    post:
      tags: [Autenticación (desarrollo)]
      summary: Crear una cuenta de cliente y obtener su token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Cliente de Prueba
              email: cliente.prueba@ecoairlines.test
              password: ClavePrueba2026
      responses:
        '201':
          description: Cuenta creada (rol CUSTOMER) y token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /login:
    post:
      tags: [Autenticación (desarrollo)]
      summary: Iniciar sesión y obtener un JWT
      description: Correo o contraseña incorrectos responden 401 con el mismo mensaje (no revela qué cuentas existen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              cliente:
                summary: Cliente de prueba
                value:
                  email: demo@ecoairlines.test
                  password: EcoDemo2026
              administrador:
                summary: Administrador
                value:
                  email: admin@ecoairlines.test
                  password: EcoAdmin2026
              incorrecto:
                summary: Contraseña incorrecta (401)
                value:
                  email: demo@ecoairlines.test
                  password: otra-clave
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          description: Correo o contraseña incorrectos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /health:
    get:
      tags: [Autenticación (desarrollo)]
      summary: Estado del servicio
      responses:
        '200':
          description: En funcionamiento
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
components:
  responses:
    Problem:
      description: Body inválido (JSON mal formado, correo inválido, contraseña de menos de 8 caracteres…)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyAttempts:
      description: Más de 10 intentos por minuto desde la misma IP
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope, user]
      properties:
        access_token:
          type: string
          description: JWT HS256 (sub, scope, iss, aud, exp…). Pegarlo en Authorize de los otros documentos.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        scope:
          type: string
          example: flights:read flights:hold flights:book flights:cancel ecoairlines:profile
        user:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            role:
              type: string
              enum: [CUSTOMER, ADMIN]
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
